global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus corre en la red bridge interna (172.30.50.0/24) y scrapea los
# listeners loopback del host via host.docker.internal. El bot solo acepta
# el scrape desde esa subred (DAVIS_METRICS_REDES_PERMITIDAS).
scrape_configs:
  - job_name: jarvis-whatsapp
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          proceso: whatsapp
    metrics_path: /metrics

  - job_name: jarvis-api
    static_configs:
      - targets: ["host.docker.internal:9465"]
        labels:
          proceso: api
    metrics_path: /metrics
